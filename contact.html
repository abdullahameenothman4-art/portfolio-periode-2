<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact met mij</title>
    <link href="css/page3.css" rel="stylesheet">
</head>
<body>

    <header>
        <h1>Contact met mij</h1>
    </header>

    <nav>
        <a href="mailto:123456789@gmail.com">E-mail</a>
        <a href="tel:123456789">Bellen</a>
    </nav>

    <main>
        <h2>Stuur mij een bericht</h2>

        <form>
            <label for="naam">Naam:</label>
            <input type="text" id="naam" name="naam" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>

            <label for="bericht">Bericht:</label>
            <textarea id="bericht" name="bericht" required></textarea>

            <button type="submit">Verzenden</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Abdullah</p>
    </footer>

</body>
</html>
